app = "bodytag-web"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  min_machines_running = 2

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "20s"
  method = "GET"
  path = "/readyz"

[env]
  HOSTED_FEE_BPS = "100"
  REQUIRE_STAKE = "true"
  PAYMENT_PROVIDER = "dodo"
  STORAGE_DRIVER = "s3"
