apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodytag-web
  labels:
    app: bodytag-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bodytag-web
  template:
    metadata:
      labels:
        app: bodytag-web
    spec:
      containers:
        - name: web
          image: ghcr.io/bodytag/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: bodytag-env
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: bodytag-web
spec:
  selector:
    app: bodytag-web
  ports:
    - port: 80
      targetPort: 3000
