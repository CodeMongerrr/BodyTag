# OSS self-host. Default fee is 0%. Official hosted sets HOSTED_FEE_BPS=100.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bodytag
      POSTGRES_PASSWORD: bodytag
      POSTGRES_DB: bodytag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodytag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bodytag
      MINIO_ROOT_PASSWORD: bodytagsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 bodytag bodytagsecret;
      mc mb -p local/bodytag || true;
      mc anonymous set download local/bodytag;
      exit 0;
      "
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bodytag:bodytag@postgres:5432/bodytag
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      SHORT_URL: ${SHORT_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      HOSTED_FEE_BPS: ${HOSTED_FEE_BPS:-0}
      REQUIRE_STAKE: ${REQUIRE_STAKE:-false}
      ENABLE_MARKETPLACE_GRID: ${ENABLE_MARKETPLACE_GRID:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bodytag
      S3_ACCESS_KEY: bodytag
      S3_SECRET_KEY: bodytagsecret
      S3_REGION: us-east-1
      CDN_BASE_URL: ${CDN_BASE_URL:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker-images:
    build:
      context: .
      dockerfile: apps/worker-images/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bodytag:bodytag@postgres:5432/bodytag
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bodytag
      S3_ACCESS_KEY: bodytag
      S3_SECRET_KEY: bodytagsecret
      S3_REGION: us-east-1
      IMAGE_QUEUE: bodytag-images
      PLAYWRIGHT_SNAPSHOTS: ${PLAYWRIGHT_SNAPSHOTS:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  worker-realtime:
    build:
      context: .
      dockerfile: apps/worker-realtime/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
